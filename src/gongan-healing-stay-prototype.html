polite" style="position:fixed;clip-path:inset(50%);width:1px;height:1px;overflow:hidden"></div><noscript><p>장면 이동을 사용하려면 JavaScript를 켜 주세요.</p></noscript><script>(()=>{'use strict';const scenes=[...document.querySelectorAll('.scene')],sound=[...document.querySelectorAll('[data-sound]')],notice=document.querySelector('[aria-live]');let index=0,quiet=false,tea=false,ctx=null,tone=null,gain=null,playing=false,busy=false,epoch=0;
const show=(n)=>{if(!Number.isInteger(n)||!scenes[n])return;index=n;scenes.forEach((s,i)=>s.hidden=i!==n);scenes[n].querySelector('h1').focus();if(n===2&&quiet)stop();};
const sync=()=>sound.forEach(b=>{b.setAttribute('aria-pressed',String(playing));b.textContent=playing?'소리 끄기':'소리 켜기';});
const stop=()=>{epoch++;playing=false;if(tone){try{tone.stop();tone.disconnect();gain.disconnect();}catch{}tone=null;gain=null;}sync();};
document.querySelectorAll('[data-scene]').forEach(b=>b.addEventListener('click',()=>show(Number(b.dataset.scene))));
sound.forEach(b=>b.addEventListener('click',async()=>{if(playing){stop();return;}if(busy)return;busy=true;const token=epoch;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error();ctx??=new Audio();await ctx.resume();if(token!==epoch||document.hidden||quiet&&index===2)return;tone=ctx.createOscillator();gain=ctx.createGain();tone.type='sine';tone.frequency.value=130.81;gain.gain.setValueAtTime(0,ctx.currentTime);gain.gain.linearRampToValueAtTime(.028,ctx.currentTime+.6);tone.connect(gain);gain.connect(ctx.destination);tone.start();playing=true;sync();}catch{stop();notice.textContent='이 기기에서는 소리를 재생할 수 없습니다.';}finally{busy=false;}}));
document.querySelector('#tea').addEventListener('click',e=>{tea=!tea;e.target.setAttribute('aria-pressed',String(tea));e.target.textContent=tea?'차 내려놓기':'차 가까이';scenes[2].querySelector('.cup').setAttribute('transform',tea?'translate(0 -18)':'translate(0 0)');notice.textContent=tea?'차를 곁으로 가져왔습니다.':'차를 내려놓았습니다.';});
document.querySelector('#quiet').addEventListener('click',e=>{quiet=!quiet;scenes[2].classList.toggle('quiet',quiet);scenes[2].querySelector('[data-sound]').hidden=quiet;e.target.setAttribute('aria-pressed',String(quiet));e.target.textContent=quiet?'고요히 머무르기 풀기':'고요히';if(quiet)stop();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});window.addEventListener('pagehide',stop);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&index){e.preventDefault();show(index-1);}});})();</script></body></html>
